<!DOCTYPE html>
<html>
<head>
  <title>Login - REACT</title>
  <style>
    body { font-family: "Segoe UI", Tahoma, Geneva, Verdana; background: #b4c7eeff; margin:0; }
    header { background: linear-gradient(135deg,#667eea,#764ba2); padding: 0.5rem 0; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; }
    .logo { font-size: 1.5rem; font-weight: bold; color: #f2f4f7ff; }
    .nav-links ul { display: flex; gap: 20px; list-style: none; margin: 0; padding: 0; }
    .nav-links { margin-left:auto; display: flex; list-style: none; gap: 30px; }
    .nav-links li{ list-style:none; }
    .nav-links a { text-decoration: none; color: white; font-weight: 500; transition: color 0.3s; font-size: 16px; }
    .nav-links a:hover { color: #ffdbe6; }
    .container { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #2c5aa0; }
    input { width: 100%; padding: 12px; margin: 12px 0; border: 1px solid #aaa; border-radius: 8px; }
    input:focus { border-color: #2c5aa0; }
    .btn { width: 100%; padding: 12px; border: none; background: linear-gradient(135deg,#667eea,#764ba2); color: white; font-size: 16px; border-radius: 8px; cursor: pointer; }
    .btn:hover { transform: scale(1.03); }
    p { text-align: center; }
    a { color: #2c5aa0; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <nav>
        <div class="logo">
          <img
            src="/images/logo.jpeg"
            alt="REACT Logo"
            style="
              height: 45px;
              width: auto;
              vertical-align: middle;
              margin-right: 0.4rem;
            "
          />REACT
        </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <h2>Login</h2>
    <form method="POST" action="/login">
      <input type="email" name="username" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" class="btn">LOGIN</button>
    </form>
    <p>Don't have an account? <a href="/register">Register</a></p>
  </div>
</body>
</html>
